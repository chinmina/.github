name: Validate Renovate config

# No workflow-level GITHUB_TOKEN scope; the single job grants exactly what it needs.
permissions: {}

on:
  pull_request:
    paths:
      - "renovate.json5"
      - "renovate/shared.json5"
      - "skills/renovate-onboard/assets/renovate.json5"
      - "skills/renovate-onboard/scripts/validate.sh"
      - ".github/workflows/renovate-validate.yml"

# Only the latest push to a PR needs validating; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate ${{ matrix.config }}
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the configs to validate them
    strategy:
      # Report every broken config, not just the first.
      fail-fast: false
      matrix:
        config:
          - renovate.json5
          - renovate/shared.json5
          - skills/renovate-onboard/assets/renovate.json5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs `npx renovate`, i.e. third-party code downloaded at
          # run time. Don't leave a usable git credential on disk for it.
          persist-credentials: false

      - name: Validate as repo config
        env:
          # Via env, not ${{ }} interpolation into the shell.
          CONFIG: ${{ matrix.config }}
        # Green does not mean the config is correct: remote `extends` presets are
        # not resolved, and unknown matchManagers values are accepted.
        run: skills/renovate-onboard/scripts/validate.sh "$CONFIG"
