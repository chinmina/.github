name: Validate shared Renovate config

# No workflow-level GITHUB_TOKEN scope; the single job grants exactly what it needs.
permissions: {}

on:
  pull_request:
    paths:
      - "renovate/shared.json5"
      - ".github/workflows/renovate-validate.yml"

# Only the latest push to a PR needs validating; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate as repo config
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the shared config to validate it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job runs `npx renovate`, i.e. third-party code downloaded at
          # run time. Don't leave a usable git credential on disk for it.
          persist-credentials: false

      - name: Copy shared config into an isolated repo-config context
        # renovate-config-validator autodetects config by filename/location.
        # It does not resolve remote `extends` presets -- this only checks the
        # file's own syntax/schema, not whether repos referencing it via
        # github>chinmina/.github//renovate/shared.json5 can resolve it.
        #
        # Do not pass the file path as an argument to the validator: that
        # validates it as *global* config against the wrong schema and can
        # report success even for an invalid repo config. Copying it to a
        # dedicated directory as renovate.json5 and running with no path
        # argument forces repo-config validation.
        run: |
          mkdir -p /tmp/renovate-validate
          cp renovate/shared.json5 /tmp/renovate-validate/renovate.json5

      - name: Validate as repo config
        working-directory: /tmp/renovate-validate
        run: npx --yes --package renovate -- renovate-config-validator --strict
