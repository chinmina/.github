name: Conventional PR Title

# No workflow-level GITHUB_TOKEN scope; the single job grants exactly what it needs.
permissions: {}

on:
  workflow_call:

jobs:
  conventional-pr-title:
    name: Check PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # read the PR title to validate it against Conventional Commits
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
