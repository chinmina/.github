name: Validate release-please config check

# Catches a bump to the validator or the release-please pin that would break
# consumers' release runs, in the PR that makes it.

# No workflow-level GITHUB_TOKEN scope; the single job grants exactly what it needs.
permissions: {}

on:
  pull_request:
    paths:
      - ".github/actions/validate-release-please-config/**"
      - ".github/workflows/release-please.yml"
      - ".github/workflows/validate-release-please-config.yml"

# Only the latest push to a PR needs validating; cancel superseded runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate release-please config check
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the action and its fixtures
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: false

      - name: Check RELEASE_PLEASE_VERSION matches release-please-action
        run: .github/actions/validate-release-please-config/test/check-version-sync.sh

      - name: Validate fixtures
        run: .github/actions/validate-release-please-config/test/run.sh
