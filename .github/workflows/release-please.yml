# Reusable release-please trigger workflow (PRD reqs R1-R7, R31-R34).
#
# Opens/updates a Release PR on pushes to the default branch and, when that PR
# is merged, creates a DRAFT GitHub Release together with its v* tag, using a
# minted GitHub App *installation* token. Because the tag is created with an
# installation token (never GITHUB_TOKEN), the tag push emits a
# workflow-triggering event that drives the downstream release wrapper (R4).
#
# Two release-please settings are REQUIRED in the consumer's config, because
# release-please-action has no input for either:
#
#   "draft": true — the wrapper publishes only after attestation, so nothing is
#     downloadable before its provenance exists.
#   "force-tag-creation": true — GitHub creates no tag for a draft release until
#     it is published. release-please builds the next Release PR in the same
#     run that creates the release, and finds the previous release by its tag;
#     without the tag it walks the entire history and opens a Release PR with
#     the wrong version and every commit since the start of the repo.
#
# The workflow VALIDATES both before release-please runs and fails loudly if
# either is missing — release-please config cannot be inherited across repos
# (it is read from the consumer's branch), so this check is how the kit
# controls it. It first validates the whole config against release-please's
# schema (validate-release-please-config), because release-please silently
# ignores unknown keys and a misspelt setting would otherwise just be off.
#
# Token source is selected per consuming repo:
#   - app      (default): chinmina GitHub App via create-github-app-token.
#   - octo-sts (keyless):  octo-sts OIDC federation. The job runs in the
#                          `automation` environment, so the OIDC subject is
#                          environment-qualified. The trust policy is CENTRALISED
#                          in the org's .github repo (scope defaults to the org),
#                          at .github/chainguard/release-please-<repo>.sts.yaml,
#                          and MUST set
#                          subject: repo:<owner>/<repo>:environment:automation
#                          (typically with claim_pattern.ref: refs/heads/main).
#
# Consumers call this at @verified-actions. On the `app` token-source they pass
# the RELEASE_PLEASE_* secrets via `secrets: inherit` (they are environment-scoped,
# so only the reusable workflow's env-targeting job can resolve them). The
# keyless octo-sts path needs NO secrets, so its callers omit `secrets:` entirely.

name: Release PR automation

on:
  workflow_call:
    secrets:
      # App path only. Both are ENVIRONMENT-scoped to `automation` and consumed
      # by the release-please job below (which runs in that environment). A
      # reusable-workflow CALL job cannot hold an `environment:`, so a narrowed
      # caller `secrets:` map would resolve EMPTY; the caller therefore delivers
      # them with `secrets: inherit` and marks that line
      # `# zizmor: ignore[secrets-inherit]` so the broad pass is clearly intended.
      # The octo-sts path is keyless and passes neither.
      RELEASE_PLEASE_CLIENT_ID:
        description: >-
          GitHub App client ID. Required only for token-source "app"; consumed by
          the release-please job in the `automation` environment. Unused on the
          keyless octo-sts path.
        required: false
      RELEASE_PLEASE_APP_PRIVATE_KEY:
        description: >-
          GitHub App private key. Required only for token-source "app"; consumed
          by the release-please job in the `automation` environment. Unused on
          the keyless octo-sts path.
        required: false
    inputs:
      token-source:
        description: Installation-token source. "app" (default) or "octo-sts".
        required: false
        type: string
        default: app
      config-file:
        description: Path to the release-please config file.
        required: false
        type: string
        default: release-please-config.json
      manifest-file:
        description: Path to the release-please manifest file.
        required: false
        type: string
        default: .release-please-manifest.json
      sts-identity:
        description: >-
          octo-sts trust policy identity (the .sts.yaml filename stem in the
          ORG's .github/chainguard/). Only used when token-source is octo-sts.
          Defaults to "release-please-<repo>" to match the centralised policy
          naming in <org>/.github.
        required: false
        type: string
        default: ""
      sts-scope:
        description: >-
          octo-sts scope: the org (or org/repo) whose trust policies are
          consulted. Only used when token-source is octo-sts. Defaults to the
          repository owner so the CENTRALISED org policies are used (not the
          consumer repo's own — which it must not be able to author).
        required: false
        type: string
        default: ""

# No workflow-level GITHUB_TOKEN scope: the job below declares exactly what it
# needs, and all writes use the minted installation token, not GITHUB_TOKEN.
permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: automation # R34
    permissions:
      contents: read # all writes use the minted installation token, not GITHUB_TOKEN
      # R34: octo-sts OIDC exchange. Declared on BOTH paths, so every caller must
      # grant id-token: write (even the app path, where it is unused) — a caller
      # that omits it fails at STARTUP, not silently.
      id-token: write
    # Strict bash for every run step (GHA's `bash` keyword gives -e + pipefail
    # but not -u; this is that same definition plus nounset), defined once.
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      # R5/R33: scope the installation token to exactly contents+pull-requests.
      - name: Mint installation token (GitHub App)
        id: app-token
        if: ${{ inputs.token-source == 'app' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # R5/R33: octo-sts scopes the token via the consumer's trust policy.
      - name: Mint installation token (octo-sts)
        id: octo-sts
        if: ${{ inputs.token-source == 'octo-sts' }}
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          # Org-scoped: the trust policy lives centrally in <org>/.github so a
          # compromised consumer workflow cannot author its own policy.
          scope: ${{ inputs.sts-scope != '' && inputs.sts-scope || github.repository_owner }}
          identity: ${{ inputs.sts-identity != '' && inputs.sts-identity || format('release-please-{0}', github.event.repository.name) }}

      # Fetch the consumer's config once (at the pushed commit) for the checks
      # below. release-please itself reads it through the API the same way.
      - name: Fetch the release-please config
        id: config
        env:
          GH_TOKEN: ${{ inputs.token-source == 'app' && steps.app-token.outputs.token || steps.octo-sts.outputs.token }}
          REPO: ${{ github.repository }}
          CONFIG_FILE: ${{ inputs.config-file }}
          REF: ${{ github.sha }}
        run: |
          path="${RUNNER_TEMP}/release-please-config.json"
          gh api "repos/${REPO}/contents/${CONFIG_FILE}?ref=${REF}" -H "Accept: application/vnd.github.raw" >"${path}"
          echo "path=${path}" >>"${GITHUB_OUTPUT}"

      # Fail on a malformed config or a misspelt key before anything is
      # created: release-please ignores unknown keys silently, so a typo would
      # just turn the setting off.
      - name: Validate the release-please config against its schema
        uses: chinmina/.github/.github/actions/validate-release-please-config@verified-actions
        with:
          config-path: ${{ steps.config.outputs.path }}

      # Enforce the draft and forced-tag requirements (see header) before
      # release-please runs. Each may be set at the top level or per package; a
      # package-level value overrides the top-level one, as in release-please.
      - name: Require draft releases and forced tag creation in the release-please config
        env:
          CONFIG_FILE: ${{ inputs.config-file }}
          CONFIG_PATH: ${{ steps.config.outputs.path }}
        run: |
          # Succeeds when key $1 is true for every package once the package's
          # settings are laid over the top-level ones (`. + $p`: the package
          # wins, as in release-please). $p and $k are jq variables, hence the
          # single quotes.
          enabled() {
            # shellcheck disable=SC2016
            jq -e --arg k "$1" '[.packages[] as $p | . + $p | .[$k] == true] | all' "${CONFIG_PATH}" >/dev/null
          }
          failed=0
          if ! enabled draft; then
            echo "::error::${CONFIG_FILE} does not enable draft releases. Set \"draft\": true (top level, or on every package) so release-please creates a DRAFT release."
            echo "The release wrapper builds and attests artifacts, then flips the release out of draft LAST; without draft, the release is published and publicly downloadable before any attestation exists."
            failed=1
          fi
          if ! enabled force-tag-creation; then
            echo "::error::${CONFIG_FILE} does not force tag creation. Set \"force-tag-creation\": true (top level, or on every package) so release-please creates the v* tag with the draft release."
            echo "A draft release has no tag until it is published. Without the tag, release-please cannot find the release it just created and opens a Release PR containing the entire commit history."
            failed=1
          fi
          if (( failed )); then
            exit 1
          fi
          echo "Confirmed ${CONFIG_FILE} enables draft releases and forced tag creation."

      # R6: if neither mint step produced a token, fail before release-please.
      - name: Release Please
        id: release
        # Bundles release-please v17.6.0. RELEASE_PLEASE_VERSION in
        # validate-release-please-config/versions.env must match; Renovate bumps
        # both in the same PR and the validate-release-please-config workflow
        # fails that PR if they disagree.
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # The token is selected inline (never re-emitted to an output) so it
          # stays masked.
          token: ${{ inputs.token-source == 'app' && steps.app-token.outputs.token || steps.octo-sts.outputs.token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # R3/R4: release-please creates the v* tag with the draft release
      # (force-tag-creation, validated above). This step is a backstop that makes
      # sure the tag exists at the release commit: release-please treats ANY 422
      # from tag creation as "tag already exists", so a rejected tag (e.g. a tag
      # ruleset without a bypass for the minted App) would otherwise pass
      # silently. Creating the ref with the installation token, never
      # GITHUB_TOKEN, is what lets the tag push trigger the downstream wrapper.
      # R7: skipped automatically when no release was created.
      - name: Ensure release tag exists
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ inputs.token-source == 'app' && steps.app-token.outputs.token || steps.octo-sts.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          # On an HTTP error gh prints the error body to stdout and ignores
          # --jq, so branch on the exit status rather than the output.
          if existing_sha="$(gh api "repos/${REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "${existing_sha}" == "${TARGET_SHA}" ]]; then
              echo "Tag ${TAG} already exists at ${TARGET_SHA} (created by release-please)."
              exit 0
            fi
            echo "::error::Tag ${TAG} exists at ${existing_sha}, not the release commit ${TARGET_SHA}."
            exit 1
          fi
          echo "::warning::release-please did not create tag ${TAG}; creating it at ${TARGET_SHA} via the installation token. Check that the minted App can bypass any v* tag ruleset, otherwise the next Release PR will be built without this tag."
          gh api \
            --method POST \
            "repos/${REPO}/git/refs" \
            -f "ref=refs/tags/${TAG}" \
            -f "sha=${TARGET_SHA}"
