name: Validate release-please config
description: >-
  Fail the release run on a release-please-config.json that release-please
  would accept but misread: release-please ignores unknown keys, so a misspelt
  setting is silently off. Checks the config against release-please's schema,
  tightened so unknown keys fail at every level, then requires "draft" and
  "force-tag-creation".

inputs:
  config-path:
    description: Local path to the release-please-config.json to validate.
    required: true

runs:
  using: composite
  steps:
    # mise only: the validator is installed on demand by `mise exec`.
    - name: Install mise
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        install: false
        cache: false

    - name: Validate release-please config
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        ACTION_PATH: ${{ github.action_path }}
      run: '"${ACTION_PATH}/validate.sh" "${CONFIG_PATH}"'
