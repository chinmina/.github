# yaml-language-server: $schema=https://raw.githubusercontent.com/binary-install/binstaller/main/schema/InstallSpec.json
# Generated from .goreleaser.yaml with `binst init --source=goreleaser`.
# Regenerate it when the archive naming or platform matrix there changes.
# The release workflow embeds each release's checksums into a working copy of
# this spec, so the committed file never changes.
schema: v1
name: shed
repo: chinmina/shed
asset:
  template: ${NAME}_${OS}_${ARCH}${EXT}
  default_extension: .tar.gz
  rules:
  - when:
      os: windows
    ext: .zip
  naming_convention:
    os: lowercase
    arch: lowercase
checksums:
  algorithm: sha256
  template: checksums.txt
supported_platforms:
- os: darwin
  arch: amd64
- os: darwin
  arch: arm64
- os: linux
  arch: amd64
- os: linux
  arch: arm64
- os: windows
  arch: amd64
- os: windows
  arch: arm64
